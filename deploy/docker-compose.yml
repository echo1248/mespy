  mysql:
    restart: always
    privileged: true
    image: mysql
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=Qkxc123456
    volumes:
      - ${DATA_ROOT}/mysql/log:/var/log/mysql # 映射日志目录，宿主机:容器
      - ${DATA_ROOT}/mysql/data:/var/lib/mysql # 映射数据目录，宿主机:容器
      - ${DATA_ROOT}/mysql/conf.d:/etc/mysql/conf.d # 映射配置目录，宿主机:容器
      - /etc/localtime:/etc/localtime:ro # 让容器的时钟与宿主机时钟同步，避免时间的问题，ro是read only的意思，就是只读。
    networks:
      - jiqid_net

  redis:
    restart: always
    privileged: true
    image: redis
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - ${DATA_ROOT}/redis/data:/data
    command: [ "redis-server", "--requirepass", "Qkxc123456" ]
    networks:
      - jiqid_net

  nginx:
    restart: always
    privileged: true
    image: nginx
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NGINX_PORT=80
      - TZ=Asia/Shanghai
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ${DATA_ROOT}/nginx/html:/usr/share/nginx/html
      - ${DATA_ROOT}/nginx/logs:/var/log/nginx
      - /etc/localtime:/etc/localtime:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - jiqid_net

  emqx-enterprise:
    restart: unless-stopped
    image: emqx/emqx-enterprise:5.10.1-rc.2
    container_name: emqx
    environment:
      # 设置 EMQX 节点的名称
      - EMQX_NODE_NAME=emqx@node1.emqx.io
      # 允许所有网络连接（用于测试，生产环境应设置更严格的规则）
      - EMQX_LISTENERS__TCP__DEFAULT__BIND=0.0.0.0:1883
      - EMQX_LISTENERS__SSL__DEFAULT__BIND=0.0.0.0:8883
      - EMQX_LISTENERS__WS__DEFAULT__BIND=0.0.0.0:8083
      - EMQX_LISTENERS__WSS__DEFAULT__BIND=0.0.0.0:8084
      # 设置 Dashboard 管理后台的默认用户名和密码
      - EMQX_DASHBOARD__DEFAULT_USERNAME=admin
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=Qkxc123456
    healthcheck:
      test: [ "CMD", "/opt/emqx/bin/emqx", "ctl", "status" ]
      interval: 5s
      timeout: 25s
      retries: 5
    ports:
      - "1883:1883"
      - "8083:8083"
      - "8084:8084"
      - "8883:8883"
      - "18083:18083"
    volumes:
      - ${DATA_ROOT}/emqx/data:/opt/emqx/data
      - ${DATA_ROOT}/emqx/log:/opt/emqx/log
    networks:
      - jiqid_net


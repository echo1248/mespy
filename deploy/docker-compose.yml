  rabbitmq:
    restart: always
    image: rabbitmq:3.9.7-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: Qkxc123456
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ${DATA_ROOT}/rabbitmq/data:/var/lib/rabbitmq

  minio:
    restart: always
    image: minio/minio
    container_name: minio
    environment:
      - MINIO_ACCESS_KEY=root
      - MINIO_SECRET_KEY=Qkxc123456
    ports:
      - "9000:9000"
      - "9090:9090"
    volumes:
      - ${DATA_ROOT}/minio/data:/data
      - ${DATA_ROOT}/minio/config:/root/.minio
    command: server /data --console-address :9090 -address :9000
    networks:
      - jiqid_net

networks:
  jiqid_net:
    driver: bridge
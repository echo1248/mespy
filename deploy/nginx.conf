
worker_processes  1;

events {
    worker_connections 2048;  # 提高连接数
    use epoll;  # Linux高效事件模型
    multi_accept on;  # 同时接受多个连接
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 基础优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;
    server_tokens off;  # 隐藏Nginx版本信息

    # 连接参数
    keepalive_timeout 65;
    keepalive_requests 1000;
    client_max_body_size 5M;
    client_body_buffer_size 128k;
    
    # 压缩优化
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;
    gzip_vary on;
    gzip_proxied any;
    gzip_disable "msie6";

    # WebSocket 支持
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # 统一后端哈希策略
    map $http_authorization $backend_hash {
        default $remote_addr;
        "~^(?<token>Bearer\s.+)" $token;
    }
    
    # mes alpha 后端
    upstream mes_alpha_api {
        hash $backend_hash consistent;  # 基于 Token 哈希
        server 10.254.220.178:8000;
    }

    # mes prod 后端
    upstream mes_prod_api {
        hash $backend_hash consistent;  # 基于 Token 哈希
        server 10.254.220.178:8100;
    }

    # mes测试(惠州工厂)
    server {
        listen 80;
        server_name alpha.mes.jiqid.net;

        # 修正 location 匹配规则
        location ~ ^/(api|docs|openapi) {
            proxy_pass http://mes_alpha_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 连接参数
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # 性能优化
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
        }

        location / {
            return 404;
        }
    }

    # mes生产(惠州工厂)
    server {
        listen 80;
        server_name mes.jiqid.net;

        # 修正 location 匹配规则
        location ~ ^/(api|docs|openapi) {
            proxy_pass http://mes_prod_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 连接参数
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # 性能优化
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
        }

        location / {
            return 404;
        }
    }

    # k8s ingress 入口
    server {
        listen 80;
        server_name openai.jiqid.net;

        location ~ ^/(api|docs|openapi|health) {
            proxy_pass "http://10.254.220.177:32075";

            # 通用代理头
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 连接参数
            proxy_connect_timeout 300s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
            proxy_buffering off;

            # WebSocket支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # 缓存控制
            proxy_cache_bypass $http_upgrade;
        }
    }

}

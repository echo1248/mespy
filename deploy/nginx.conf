# 进程优化
worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 65535;

# 错误日志配置
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
    accept_mutex on;
}

http {
    # 基础设置
    include mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;

    # 日志格式优化
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main buffer=32k flush=1m;

    # 性能优化核心参数
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30s;
    keepalive_requests 10000;
    client_max_body_size 10M;
    client_body_buffer_size 256k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;
    output_buffers 2 128k;
    postpone_output 1460;

    # 连接限制
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_zone $server_name zone=perserver:10m;
    limit_conn perip 100;
    limit_conn perserver 1000;

    # 请求限制
    limit_req_zone $binary_remote_addr zone=req_limit:10m rate=10r/s;

    # 超时设置优化
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;
    reset_timedout_connection on;

    # 文件缓存优化
    open_file_cache max=200000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # 压缩优化
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # WebSocket支持
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # 统一后端哈希策略
    map $http_authorization $backend_hash {
        default $remote_addr;
        "~^(?<token>Bearer\s.+)" $token;
    }

    # MES服务路由映射 - 修复关键问题
    map $host $mes_upstream {
        alpha.mes.jiqid.net   mes_alpha_api;
        mes.jiqid.net         mes_prod_api;
        default               mes_alpha_api;
    }

    # 上游服务通用配置
    upstream mes_alpha_api {
        hash $backend_hash consistent;
        server 10.254.220.178:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream mes_prod_api {
        hash $backend_hash consistent;
        server 10.254.220.178:8100 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # 大模型服务统一配置
    upstream en_llm_api { server 10.254.220.178:9100 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream es_llm_api { server 10.254.220.178:9200 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream de_llm_api { server 10.254.220.178:9300 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream fr_llm_api { server 10.254.220.178:9400 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream nl_llm_api { server 10.254.220.178:9500 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream th_llm_api { server 10.254.220.178:9600 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream ar_llm_api { server 10.254.220.178:9700 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream zh_llm_api { server 10.254.220.178:9800 max_fails=3 fail_timeout=30s; keepalive 32; }

    # 通用代理配置
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 16k;
    proxy_temp_path /var/cache/nginx/proxy_temp;

    # 缓存路径设置
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m inactive=60m max_size=1g;

    # 安全头通用配置
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==================== MES服务配置 ====================
    # Alpha环境
    server {
        listen 80 reuseport;
        server_name alpha.mes.jiqid.net;

        # 请求限制
        limit_req zone=req_limit burst=20 nodelay;

        location ~ ^/(api|docs|openapi) {
            # 使用map变量，确保路由正确
            proxy_pass http://$mes_upstream;

            # 代理头
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;

            # 调试信息
            add_header X-Upstream-Service $mes_upstream;
            add_header X-Debug-Host $host;
        }

        location / {
            return 404;
        }
    }

    # 生产环境
    server {
        listen 80 reuseport;
        server_name mes.jiqid.net;

        # 请求限制
        limit_req zone=req_limit burst=20 nodelay;

        location ~ ^/(api|docs|openapi) {
            # 使用map变量，确保路由正确
            proxy_pass http://$mes_upstream;

            # 代理头
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;

            # 缓存静态响应
            location ~ ^/api/.*\.(json|xml)$ {
                proxy_cache api_cache;
                proxy_cache_valid 200 5m;
                proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
                proxy_cache_lock on;
            }

            # 调试信息
            add_header X-Upstream-Service $mes_upstream;
            add_header X-Debug-Host $host;
        }

        location / {
            return 404;
        }
    }

    # ==================== K8s Ingress入口 ====================
    server {
        listen 80 reuseport;
        server_name openai.jiqid.net;

        location ~ ^/(api|docs|openapi|health) {
            proxy_pass "http://10.254.220.178:32075";

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # 长连接优化
            proxy_connect_timeout 300s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
            proxy_buffering off;

            # WebSocket支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ==================== 官网配置 ====================
    server {
        listen 80 reuseport;
        server_name ~^(www\.)?(jiqid|roboland)\.(com|com\.cn)$;

        set $site_name "";
        if ($host ~* "jiqid") {
            set $site_name "jiqid";
        }
        if ($host ~* "roboland") {
            set $site_name "roboland";
        }

        # API代理
        location ~ ^/(captcha|validate|mitu|sys|get_downld_url|get_pl_list) {
            proxy_pass http://120.92.88.7$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 缓存API响应
            proxy_cache api_cache;
            proxy_cache_valid 200 10m;
            proxy_cache_methods GET HEAD;
        }

        # 静态资源
        location / {
            try_files $uri $uri/ /index.html;
            root /usr/share/nginx/html/$site_name/dist/;

            # 强缓存静态资源
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }

            # HTML文件不缓存
            location ~* \.html$ {
                expires -1;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
            }
        }
    }

    # ==================== 域名重定向 ====================
    server {
        listen 80;
        server_name jiqid.com m.jiqid.com cloud.jiqid.com;
        return 301 http://www.jiqid.com$request_uri;
    }

    server {
        listen 80;
        server_name roboland.com.cn;
        return 301 http://www.roboland.com.cn$request_uri;
    }

    # ==================== 大模型API服务 ====================
    server {
        listen 80 reuseport;
        server_name "~^(?:(?<lang>[a-z]{2})\.)?api\.jiqid\.net$";

        # 默认中文服务
        set $llm_upstream zh_llm_api;
        if ($lang = "en") { set $llm_upstream en_llm_api; }
        if ($lang = "es") { set $llm_upstream es_llm_api; }
        if ($lang = "de") { set $llm_upstream de_llm_api; }
        if ($lang = "fr") { set $llm_upstream fr_llm_api; }
        if ($lang = "nl") { set $llm_upstream nl_llm_api; }
        if ($lang = "th") { set $llm_upstream th_llm_api; }
        if ($lang = "ar") { set $llm_upstream ar_llm_api; }

        location ~ ^/(api|docs|openapi|health) {
            proxy_pass http://$llm_upstream;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_connect_timeout 300s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
            proxy_buffering off;

            # WebSocket支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ==================== 默认服务器 ====================
    server {
        listen 80 default_server reuseport;
        server_name _;
        return 444;
    }
}